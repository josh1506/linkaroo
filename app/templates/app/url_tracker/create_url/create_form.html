<form class="d-flex flex-column gap-3 p-4 rounded-4 shadow bg-default" action="{% url 'url_tracker:create' %}" method="POST">
    {% if form.errors %}
        <div class="alert alert-danger" role="alert">
            <p class="mb-0">Please correct the highlighted fields below.</p>
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    {{ form }}
    {% csrf_token %}
    <div class="d-flex justify-content-between">
        <a href="{% url 'url_tracker:list' %}" class="btn btn-danger">Cancel</a>
        <button type="submit" class="btn btn-success">Create</button>
    </div>
</form>

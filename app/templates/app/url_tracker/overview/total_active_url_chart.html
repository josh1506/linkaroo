<div class="rounded-4 shadow p-4 my-4 bg-default">
    <h2 class="h5">Total Active URL</h2>
    <div class="overflow-hidden">
        {% if has_links %}
            <div id="total-active-url-chart" class="chart" role="img" aria-label="Share of links with at least one click">Loading chart…</div>
        {% else %}
            {% include 'app/components/empty_state.html' with message="No links yet." show_cta=False %}
        {% endif %}
    </div>
</div>

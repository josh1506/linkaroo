<div class="col shadow mx-3 rounded-4 p-4 bg-default">
    <div>
        <h2 class="h5">Latest Total Clicks</h2>
    </div>
    <div>
        {% if has_links %}
            <div id="latest_total_clicks_chart" class="chart" role="img" aria-label="Clicks per link per day, last 7 days">Loading chart…</div>
        {% else %}
            {% include 'app/components/empty_state.html' with message="No clicks yet." show_cta=False %}
        {% endif %}
    </div>
</div>

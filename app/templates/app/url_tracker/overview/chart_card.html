<div class="{{ card_class|default:'col shadow m-3 rounded-4 p-4 bg-default' }}">
    <h2 class="h5">{{ title }}</h2>
    {% if has_links %}
        <div id="{{ chart_id }}" class="chart" role="img" aria-label="{{ label }}">Loading chart…</div>
    {% else %}
        {% include 'app/components/empty_state.html' with message=empty_message|default:"No clicks yet." show_cta=False %}
    {% endif %}
</div>
